<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <!-- Meta tags essenciais -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título da página -->
    <title>Calculadora</title>
    
    <!-- Vinculação com folha de estilos CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Container principal da calculadora -->
    <div class="calculadora">
      <!-- Display que mostra os números e resultado (desabilitado para leitura) -->
      <input type="text" id="display" disabled />
      
      <!-- Grid de botões da calculadora (4 colunas x 4 linhas) -->
      <div class="buttons">
        <!-- Primeira linha: 7, 8, 9, / -->
        <button class="button" onclick="appendNumber('7')">7</button>
        <button class="button" onclick="appendNumber('8')">8</button>
        <button class="button" onclick="appendNumber('9')">9</button>
        <button class="button" onclick="appendOperation('/')">/</button>

        <!-- Segunda linha: 4, 5, 6, * -->
        <button class="button" onclick="appendNumber('4')">4</button>
        <button class="button" onclick="appendNumber('5')">5</button>
        <button class="button" onclick="appendNumber('6')">6</button>
        <button class="button" onclick="appendOperation('*')">*</button>

        <!-- Terceira linha: 1, 2, 3, - -->
        <button class="button" onclick="appendNumber('1')">1</button>
        <button class="button" onclick="appendNumber('2')">2</button>
        <button class="button" onclick="appendNumber('3')">3</button>
        <button class="button" onclick="appendOperation('-')">-</button>

        <!-- Quarta linha: 0, C, =, + -->
        <button class="button" onclick="appendNumber('0')">0</button>
        <button class="button" onclick="clearDisplay('C')">C</button>
        <button class="button" onclick="calculate('=')">=</button>
        <button class="button" onclick="appendOperation('+')">+</button>
      </div>
    </div>

    <!-- Vinculação com arquivo JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
